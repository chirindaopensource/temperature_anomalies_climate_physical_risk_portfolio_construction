# ==================================================================================================
#
#  Temperature Anomalies and Climate Physical Risk in Portfolio Construction — Study Configuration
#
#  Implementation-grade configuration holding every study parameter of the study inputs
#  specification (its STUDY_CONFIG dictionary) in the key names and nesting that
#  run_research_pipeline (Task 40) and the Task 1 validators consume. Where the study
#  inputs and the code name a parameter differently,
#  the code name is used and the study-input name is recorded in the comment. Where shapes
#  clash, the code shape is used and the study-input value is stored inside it. Values follow
#  the study inputs unless a validator or a stage parse would break; every such case is marked
#  DISCREPANCY in the comment next to the key.
#
#  Configuration Sections:
#  * study_metadata — Study metadata, reference environment, header metadata (_meta)
#  * global_design_constants — Global design constants: Eq. (2) spec, analysis windows
#  * raw_input_schemas — Raw input table schemas (study inputs items i-xii)
#  * data_preprocessing_parameters — Preprocessing: Eq. (1)-(3), (11)-(12), covariance
#  * module_M1_climate_signal — Module M1 climate signal: Eq. (1)-(3)
#  * module_M2_dependence — Module M2 dependence: Eq. (4)-(7)
#  * module_M3_regressions — Module M3 return regressions: Eq. (8)-(10)
#  * module_M5_metrics — Module M5 CRE/CEV metrics: Eq. (13)-(18)
#  * module_M6_optimization — Module M6 optimisation: Eq. (19a)-(19c), (20), Table 4
#  * module_M7_scalarization — Module M7 scalarisation: Table 8 tilts
#  * module_M8_backtest — Module M8 backtest and Table 9 metrics
#  * mopso_hyperparameters — MOPSO (Algorithm 1) hyperparameters: Table C.10, seeds
#  * diagnostics_and_reporting — Diagnostics and reference values (Tables 1-3, 5-7, 9)
#  * plot_construction — Plot construction parameters (Figures 1-10, B.11-B.12, C.13)
#  * prompt_templates — Absence declaration: prompt templates
#  * llm_configuration — Absence declaration: LLM configuration
#  * network_architecture_parameters — Absence declaration: network architecture
#  * network_training_parameters — Absence declaration: network training
#  * explicitly_absent_components — Explicitly absent components
#  * methodological_notes — Methodological notes and judgment-call register
#  * coverage_verification — Coverage map: equation/artifact labels -> dotted paths
#
#  Usage/Consumption:
#  * Load with yaml.safe_load (or json.load on study_config.json, which carries the identical
#    data tree) and pass the mapping as run_research_pipeline(stage_inputs, config=cfg),
#    defined in the notebook's Task 40 cell.
#  * validate_pipeline_inputs deep-copies the mapping; execute_pipeline_stages injects it as
#    the `config` keyword into every stage whose signature accepts one.
#  * Stage 1 (orchestrate_task_1, Task 1) runs validate_study_config (exactly these 21
#    top-level keys, typed coverage targets, nulls only under the absence declarations, no
#    unresolved-marker strings) and validate_rng_seed_protocol before anything is written.
#  * Keys tagged 'Read by' name the notebook callable (and its Task) that reads them;
#    keys tagged Documentary are carried for completeness and are not read by
#    run_research_pipeline. 'Task N' refers to the notebook's '# Task N: ...' sections;
#    'the Task specification' means the Task N / Step k sections of the notebook.
#  * Dates are ISO-8601 strings (the code parses strings with pandas); floats carry a decimal
#    point; null is used only where the study declares an absent component.
#  * study_metadata.config_checksum_sha256 must be recomputed if any value is edited.
#
#  Paper Reference:
#  Azzone, M., Bechi, C., & Sbaiz, G. (2026). Temperature Anomalies and Climate Physical Risk
#  in Portfolio Construction. arXiv preprint arXiv:2604.11143. https://arxiv.org/abs/2604.11143
#
#  Author: CS Chirinda
#  License: MIT
#  Version: 1.0.0
#  Source: study inputs specification (revised STUDY_CONFIG of the study)
#
# ==================================================================================================

# --------------------------------------------------------------------------------------------------
# 1. Study metadata, reference environment, header metadata (_meta)
# --------------------------------------------------------------------------------------------------
# Provenance, reference environment and seed-protocol metadata. From the study inputs specification.
study_metadata:
  # Study title (string). From the study inputs specification. DISCREPANCY: code default was
  # "Temperature Anomalies Climate Risk"; study-input value kept. Not read by any stage.
  title: "Temperature Anomalies and Climate Physical Risk in Portfolio Construction"
  # Release tag of the reproduction (string). Code default (`build_default_study_config`, Task 1);
  # not in the study inputs specification. Not read by any stage.
  tag: "v1.0-reproduction"
  # Reference execution rig of the 217.39 s benchmark (Sec. 5).
  reference_hardware:
    # From the study inputs specification (named study_metadata.reference_environment.hardware.cpu
    # there). Not read by any stage.
    cpu: "Intel Core i5"
    # Reference RAM, unit: GB. From the study inputs specification (named
    # study_metadata.reference_environment.hardware.ram_gb there). Not read by any stage.
    ram_gb: 16
    # From the study inputs specification (named study_metadata.reference_environment.hardware.os
    # there). Not read by any stage.
    os: "Windows 10 Pro"
    # From the study inputs specification (named study_metadata.reference_environment.ide there).
    # Not read by any stage.
    ide: "PyCharm 2025.2.3"
  # From the study inputs specification.
  reference_environment:
    # From the study inputs specification. UNSPECIFIED IN MANUSCRIPT: Software library versions,
    # BLAS variant, and compiler flags are not disclosed. Reproducibility requires pinning them in a
    # conda-lock.yml or Dockerfile. UNSPECIFIED IN MANUSCRIPT. DISCREPANCY: study inputs give
    # ["python", "numpy", "scipy", "pandas", "statsmodels", "scikit-learn", "matplotlib",
    # "py-mopso_or_equivalent", "openblas_or_mkl"]; `orchestrate_task_1` (Task 1) passes this list
    # to query_library_versions, which raises ValueError for any name that is not an installed
    # distribution ('python', 'py-mopso_or_equivalent', 'openblas_or_mkl' are not); the code value
    # is kept. Read by `orchestrate_task_1` (Task 1) (library pin audit).
    software_libraries_to_pin:
      - "numpy"
      - "pandas"
      - "scikit-learn"
      - "scipy"
      - "matplotlib"
      - "statsmodels"
      - "pyarrow"
    # ---- Study-input parameters with no counterpart in the code default (documentary unless tagged
    # 'Read by') ----
    # Reference MOPSO runtime per monthly optimisation, unit: seconds. From the study inputs
    # specification. Documentary: not consumed by run_research_pipeline.
    runtime_reference_seconds_per_month: 217.39
  # ---- Study-input parameters with no counterpart in the code default (documentary unless tagged
  # 'Read by') ----
  # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
  authors: ["Michele Azzone", "Carlo Bechi", "Gabriele Sbaiz"]
  # From the study inputs specification.
  affiliations:
    # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
    "Michele Azzone": "Politecnico di Milano, Via Bonardi 9, Milano 20149, Italy"
    # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
    "Carlo Bechi": "Politecnico di Milano, Via Bonardi 9, Milano 20149, Italy"
    # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
    "Gabriele Sbaiz": "University of Trieste, Via A. Valerio 4/1, Trieste 34127, Italy"
  # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
  corresponding_author_email: "michele.azzone@polimi.it"
  # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
  keywords:
    - "Climate Aware Portfolio Optimization"
    - "Physical Climate Risk"
    - "Temperature Anomalies"
    - "Climate Change"
  # Universe/fundamentals freeze date (ISO date string). From the study inputs specification.
  # Source: §4.3 (Pareto frontier computed at January 1, 2020). Added (the analysis reference date
  # was absent) to pin fundamentals snapshot, universe membership, and MOPSO input state.
  # Documentary: not consumed by run_research_pipeline.
  analysis_anchor_date: "2020-01-01"
  # Header metadata (mirrors the comment banner; JSON has no comments).
  _meta:
    # Header metadata mirroring the comment banner (kept under study_metadata so that no new
    # top-level key is added); not in the study inputs specification. Not read by any stage.
    title: "Temperature Anomalies and Climate Physical Risk in Portfolio Construction — Study \
      Configuration"
    # Header metadata mirroring the comment banner (kept under study_metadata so that no new
    # top-level key is added); not in the study inputs specification. Not read by any stage.
    paper_reference: "Azzone, M., Bechi, C., & Sbaiz, G. (2026). Temperature Anomalies and Climate \
      Physical Risk in Portfolio Construction. arXiv preprint arXiv:2604.11143."
    # Header metadata mirroring the comment banner (kept under study_metadata so that no new
    # top-level key is added); not in the study inputs specification. Not read by any stage.
    arxiv_id: "2604.11143"
    # Header metadata mirroring the comment banner (kept under study_metadata so that no new
    # top-level key is added); not in the study inputs specification. Not read by any stage.
    url: "https://arxiv.org/abs/2604.11143"
    # Header metadata mirroring the comment banner (kept under study_metadata so that no new
    # top-level key is added); not in the study inputs specification. Not read by any stage.
    author: "CS Chirinda"
    # Header metadata mirroring the comment banner (kept under study_metadata so that no new
    # top-level key is added); not in the study inputs specification. Not read by any stage.
    license: "MIT"
    # Header metadata mirroring the comment banner (kept under study_metadata so that no new
    # top-level key is added); not in the study inputs specification. Not read by any stage.
    version: "1.0.0"
    # Header metadata mirroring the comment banner (kept under study_metadata so that no new
    # top-level key is added); not in the study inputs specification. Not read by any stage.
    source: "study inputs specification"
    # Header metadata mirroring the comment banner (kept under study_metadata so that no new
    # top-level key is added); not in the study inputs specification. Not read by any stage.
    consumer: "run_research_pipeline(config=...) (Task 40 of the notebook)"
  # SHA-256 of the canonical JSON of this tree (sorted keys) EXCLUDING this field, computed with
  # `compute_config_checksum` (Task 1); recomputed for this file. Not read by any stage.
  config_checksum_sha256: "9561d8123f18850401d6a220104a618455ee7f3e0672b710f7597f52c0658931"

# --------------------------------------------------------------------------------------------------
# 2. Global design constants: Eq. (2) spec, analysis windows
# --------------------------------------------------------------------------------------------------
# Constants shared across modules: Eq. (2) threshold and windows. From the study inputs
# specification.
global_design_constants:
  # Canonical Eq. (2) spec read by Task 6: B_{k,t} = 1 if Z_{k,t} > tau, else 0. From the study
  # inputs specification.
  extreme_event:
    # tau in Eq. (2), unit: standard deviations. From the study inputs specification (named
    # global_design_constants.extreme_event.threshold_tau there). Source: Equation (2). Read by
    # `resolve_extreme_spec` (Task 6).
    threshold: 2
    # Comparison operator of Eq. (2) (strict >). From the study inputs specification (named
    # global_design_constants.extreme_event.threshold_operator there). Source: Equation (2). Read by
    # `resolve_extreme_spec` (Task 6).
    operator: "strict_greater_than"
    # Only positive (warm) anomalies count (Sec. 2.1). From the study inputs specification (named
    # global_design_constants.extreme_event.anomaly_direction there). Source: §2.1. Read by
    # `resolve_extreme_spec` (Task 6).
    tail: "positive_only"
    # ---- Study-input parameters with no counterpart in the code default (documentary unless tagged
    # 'Read by') ----
    # P(Z > 2) under a standard normal, unit: probability. From the study inputs specification.
    # Source: §2.1. Documentary: not consumed by run_research_pipeline.
    gaussian_upper_tail_probability_at_tau: 0.0228
    # From the study inputs specification. Source: Equation (2). Documentary: not consumed by
    # run_research_pipeline.
    indicator_values: [0, 1]
  # Deprecated flat alias of extreme_event.threshold. Code default (`build_default_study_config`,
  # Task 1); not in the study inputs specification. Read by `resolve_extreme_spec` (Task 6)
  # (fallback only).
  extreme_threshold_tau: 2
  # Deprecated flat alias of extreme_event.operator. Code default (`build_default_study_config`,
  # Task 1); not in the study inputs specification. Read by `resolve_extreme_spec` (Task 6)
  # (fallback only).
  threshold_operator: "strict_greater_than"
  # Deprecated flat alias of extreme_event.tail. Code default (`build_default_study_config`, Task
  # 1); not in the study inputs specification. Read by `resolve_extreme_spec` (Task 6) (fallback
  # only).
  anomaly_direction: "positive_only"
  # Analysis windows as ISO date strings, inclusive endpoints; 'months' = month count.
  windows:
    # From the study inputs specification (named
    # global_design_constants.temporal_windows.full_sample there). Source: §2.1.
    full_sample:
      # From the study inputs specification (named
      # global_design_constants.temporal_windows.full_sample[0] there). Source: §2.1. Not read by
      # any stage.
      start: "1940-01-01"
      # From the study inputs specification (named
      # global_design_constants.temporal_windows.full_sample[1] there). Source: §2.1. Not read by
      # any stage.
      end: "2025-04-30"
      # Code default (`build_default_study_config`, Task 1); not in the study inputs specification.
      # Not read by any stage.
      months: 1024
    # Eq. (1) climatology baseline (mu_{k,m}, sigma_{k,m}). From the study inputs specification
    # (named global_design_constants.temporal_windows.baseline there). Source: §2.1.
    baseline:
      # From the study inputs specification (named
      # global_design_constants.temporal_windows.baseline[0] there). Source: §2.1. Not read by any
      # stage.
      start: "1960-01-01"
      # From the study inputs specification (named
      # global_design_constants.temporal_windows.baseline[1] there). Source: §2.1. DISCREPANCY: code
      # default was "1990-12-01"; study-input value kept. The paper (Section 2.1) states 'a
      # reference period (baseline) spanning from 1960 to 1990' with no day given; the study-input
      # value 1990-12-31 is kept. Not read by any stage.
      end: "1990-12-31"
      # Code default (`build_default_study_config`, Task 1); not in the study inputs specification.
      # Not read by any stage.
      obs_per_calendar_month: 31
    # Averaging window of p-bar_k used in Eq. (5)-(7). From the study inputs specification (named
    # global_design_constants.temporal_windows.averaging_for_bar_p there). Source: §2.3.
    frechet_hoeffding_average:
      # From the study inputs specification (named
      # global_design_constants.temporal_windows.averaging_for_bar_p[0] there). Source: §2.3. Not
      # read by any stage.
      start: "1940-01-01"
      # From the study inputs specification (named
      # global_design_constants.temporal_windows.averaging_for_bar_p[1] there). Source: §2.3.
      # DISCREPANCY: code default was "2020-12-01"; study-input value kept. month-end vs month-start
      # representation of the same final month. Not read by any stage.
      end: "2020-12-31"
      # Code default (`build_default_study_config`, Task 1); not in the study inputs specification.
      # Not read by any stage.
      months: 972
    # Return sample for Eq. (8)-(10). From the study inputs specification (named
    # global_design_constants.temporal_windows.return_sample there). Source: §2.4.
    return_regression:
      # From the study inputs specification (named
      # global_design_constants.temporal_windows.return_sample[0] there). Source: §2.4. Not read by
      # any stage.
      start: "2004-01-01"
      # From the study inputs specification (named
      # global_design_constants.temporal_windows.return_sample[1] there). Source: §2.4. Not read by
      # any stage.
      end: "2025-04-01"
      # Code default (`build_default_study_config`, Task 1); not in the study inputs specification.
      # Not read by any stage.
      months: 256
    # Out-of-sample backtest window (Sec. 5). From the study inputs specification (named
    # global_design_constants.temporal_windows.backtest there). Source: §5.
    backtest:
      # From the study inputs specification (named
      # global_design_constants.temporal_windows.backtest[0] there). Source: §5. Not read by any
      # stage.
      start: "2020-01-01"
      # From the study inputs specification (named
      # global_design_constants.temporal_windows.backtest[1] there). Source: §5. Not read by any
      # stage.
      end: "2025-04-30"
      # Code default (`build_default_study_config`, Task 1); not in the study inputs specification.
      # Not read by any stage.
      months: 64
    # Rolling in-sample estimation window.
    backtest_in_sample:
      # From the study inputs specification (named
      # global_design_constants.temporal_windows.in_sample_rolling_start there). Source: §5. Not
      # read by any stage.
      start: "2015-01-01"
      # Code default (`build_default_study_config`, Task 1); not in the study inputs specification.
      # Not read by any stage.
      months: 60
      # From the study inputs specification (named
      # global_design_constants.temporal_windows.in_sample_rolling_length_years there). Source: §5.
      # Documentary: not consumed by run_research_pipeline.
      length_years: 5
    # Restricted Eq. (3) fit window (Fig. 2). From the study inputs specification (named
    # global_design_constants.temporal_windows.restricted_sample there). Source: §2.1 Fig 2; §4.3.
    logit_restricted_fit:
      # From the study inputs specification (named
      # global_design_constants.temporal_windows.restricted_sample[1] there). Source: §2.1 Fig 2;
      # §4.3. Not read by any stage.
      end: "2019-12-31"
      # From the study inputs specification (named
      # global_design_constants.temporal_windows.restricted_sample[0] there). Source: §2.1 Fig 2;
      # §4.3. Documentary: not consumed by run_research_pipeline.
      start: "1940-01-01"
  # ---- Study-input parameters with no counterpart in the code default (documentary unless tagged
  # 'Read by') ----
  # From the study inputs specification.
  geographic_scope:
    # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
    continents_included: ["North America", "South America", "Europe", "Africa", "Asia", "Oceania"]
    # From the study inputs specification. Source: §2.1. Documentary: not consumed by
    # run_research_pipeline.
    continents_excluded: ["Antarctica"]
    # From the study inputs specification. Source: §2.1. Documentary: not consumed by
    # run_research_pipeline.
    number_of_continents_K: 6
    # From the study inputs specification. Source: §2.1. Documentary: not consumed by
    # run_research_pipeline.
    number_of_calendar_months: 12
  # From the study inputs specification.
  portfolio_universe_and_mechanics:
    # From the study inputs specification. Source: §4.1. Documentary: not consumed by
    # run_research_pipeline.
    portfolio_universe_size_N: 120
    # Weights below this are treated as inactive, unit: portfolio weight fraction. From the study
    # inputs specification. Source: §4.3. Documentary: not consumed by run_research_pipeline.
    active_weight_truncation: 0.001
    # R_f in Sharpe/Sortino, unit: decimal per month. From the study inputs specification. Source:
    # §5. Documentary: not consumed by run_research_pipeline.
    risk_free_rate_for_sharpe_sortino: 0.0
    # From the study inputs specification. Source: §5. Documentary: not consumed by
    # run_research_pipeline.
    rebalance_frequency: "monthly_first_business_day"
    # From the study inputs specification. UNSPECIFIED IN MANUSCRIPT — see the trading-calendar
    # table df_trading_calendar_raw. Documentary: not consumed by run_research_pipeline.
    rebalance_calendar_market: "global_intersection"
    # From the study inputs specification. Source: §5. Documentary: not consumed by
    # run_research_pipeline.
    transaction_cost_accounting: "excluded"
    # From the study inputs specification. Source: §5. Documentary: not consumed by
    # run_research_pipeline.
    bid_ask_spread_accounting: "excluded"
    # From the study inputs specification. Source: §5. Documentary: not consumed by
    # run_research_pipeline.
    rebalance_cost_accounting: "excluded"
    # From the study inputs specification. Source: §4.1. Documentary: not consumed by
    # run_research_pipeline.
    short_selling: "excluded"
    # From the study inputs specification. Source: §4.1. Documentary: not consumed by
    # run_research_pipeline.
    risk_free_allocation_in_portfolio: "excluded"
    # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
    flexibility_annotation: "risk_free_and_short_selling_can_be_added"
  # From the study inputs specification.
  annualisation_convention:
    # From the study inputs specification. Standard CAGR; Source: §5. Documentary: not consumed by
    # run_research_pipeline.
    cagr_exponent: "12_over_number_of_months"
    # Multiplier applied to monthly Sharpe (dimensionless). From the study inputs specification.
    # UNSPECIFIED IN MANUSCRIPT — Sharpo/Sortino annualisation factor was absent. Recommended:
    # annualise the monthly mean return directly (factor = 12) rather than scaling the standard
    # deviation by sqrt(12). Both are defensible; the choice must be consistent across all
    # strategies. Documentary: not consumed by run_research_pipeline.
    sharpe_annualisation_factor: 12.0
    # Multiplier applied to monthly Sortino (dimensionless). From the study inputs specification.
    # UNSPECIFIED IN MANUSCRIPT — same as Sharpe. Documentary: not consumed by
    # run_research_pipeline.
    sortino_annualisation_factor: 12.0
    # From the study inputs specification. UNSPECIFIED IN MANUSCRIPT — Sortino and Satchell (2001)
    # is cited but the exact downside-deviation formula is not restated. Recommended: standard
    # deviation of returns below the risk-free rate (here zero). Documentary: not consumed by
    # run_research_pipeline.
    sortino_downside_deviation_definition: "std_of_negative_excess_returns_only"
    # From the study inputs specification. Source: §5 (Sortino and Satchell 2001; Aprea and Sbaiz
    # 2025). Documentary: not consumed by run_research_pipeline.
    max_drawdown_definition: "peak_to_trough_maximum_decline"
  # From the study inputs specification.
  multiple_testing_policy:
    # From the study inputs specification. UNSPECIFIED IN MANUSCRIPT — the paper reports raw
    # p-values in Tables 2 and 3. Recommended: report raw p-values as primary, and produce a
    # BHY-corrected robustness appendix. Documentary: not consumed by run_research_pipeline.
    correction_method: "none"
    # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
    family_definition: "sector_x_continent_pairs_within_table_2_and_table_3"
    # Significance levels (probabilities). From the study inputs specification. Documentary: not
    # consumed by run_research_pipeline.
    alpha_levels: [0.1, 0.05, 0.01]
    # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
    sensitivity_options: ["none", "bonferroni", "holm", "benjamini_hochberg_yekutieli"]

# --------------------------------------------------------------------------------------------------
# 3. Raw input table schemas (study inputs items i-xii)
# --------------------------------------------------------------------------------------------------
# Column schemas of the raw input tables (items i-xii of the study inputs). From the study inputs
# specification.
raw_input_schemas:
  # df_temperature_raw schema; `validate_temperature_enums` (Task 2) reads optional
  # allowed_continents / allowed_spatial_methods / allowed_quality_flags here (none are set, so its
  # module defaults apply). From the study inputs specification (named
  # raw_input_schemas.temperature_monthly_panel there). Read by `validate_temperature_enums` (Task
  # 2) (node lookup).
  temperature_panel:
    # From the study inputs specification (named raw_input_schemas.temperature_monthly_panel.grain
    # there). DISCREPANCY: code default was ["continent", "year_month"]; study-input value kept.
    # Read by `validate_temperature_enums` (Task 2) (node lookup).
    grain: "continent x year_month"
    # From the study inputs specification (named
    # raw_input_schemas.temperature_monthly_panel.table_name there). Read by
    # `validate_temperature_enums` (Task 2) (node lookup).
    table_name: "df_temperature_raw"
    # From the study inputs specification (named
    # raw_input_schemas.temperature_monthly_panel.primary_key there). Read by
    # `validate_temperature_enums` (Task 2) (node lookup).
    primary_key: ["continent", "year_month"]
    # From the study inputs specification (named raw_input_schemas.temperature_monthly_panel.source
    # there). Read by `validate_temperature_enums` (Task 2) (node lookup).
    source: "Our World in Data (Footnote 4 §2 lead)"
    # From the study inputs specification (named
    # raw_input_schemas.temperature_monthly_panel.upstream_institutions there). Read by
    # `validate_temperature_enums` (Task 2) (node lookup).
    upstream_institutions: ["IPCC", "NASA", "World Bank"]
    # From the study inputs specification (named
    # raw_input_schemas.temperature_monthly_panel.coverage there). Read by
    # `validate_temperature_enums` (Task 2) (node lookup).
    coverage: ["1940-01-01", "2025-04-30"]
    # From the study inputs specification (named
    # raw_input_schemas.temperature_monthly_panel.frequency there). Read by
    # `validate_temperature_enums` (Task 2) (node lookup).
    frequency: "monthly"
    # ---- Study-input parameters with no counterpart in the code default (documentary unless tagged
    # 'Read by') ----
    # From the study inputs specification (named raw_input_schemas.temperature_monthly_panel.columns
    # there).
    columns:
      # From the study inputs specification (named
      # raw_input_schemas.temperature_monthly_panel.columns.continent there). Read by
      # `validate_temperature_enums` (Task 2) (node lookup).
      continent: "object (categorical, 6 values)"
      # From the study inputs specification (named
      # raw_input_schemas.temperature_monthly_panel.columns.year_month there). Read by
      # `validate_temperature_enums` (Task 2) (node lookup).
      year_month: "datetime64[ns] (first of month, UTC)"
      # From the study inputs specification (named
      # raw_input_schemas.temperature_monthly_panel.columns.calendar_month there). Read by
