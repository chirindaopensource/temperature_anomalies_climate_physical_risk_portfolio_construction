    sensitivity_estimator: "stacked-row Newey-West HAC"
    # Code default (`build_default_study_config`, Task 1); not in the study inputs specification.
    # Not read by any stage.
    sensitivity_lag_rule: "floor(4*(T_rows/100)^(2/9))"
  # Sec. 2.4 excluded sector labels. From the study inputs specification (named
