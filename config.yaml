# --------------------------------------------------------------------------------------------------
# 4. Preprocessing: Eq. (1)-(3), (11)-(12), covariance
# --------------------------------------------------------------------------------------------------
# Preprocessing for Eq. (1)-(3), (11)-(12) and covariance inputs. From the study inputs
# specification.
data_preprocessing_parameters:
  # Eq. (1): Z_{k,t} = (T_{k,t} - mu_{k,m(t)}) / sigma_{k,m(t)}. From the study inputs
  # specification. Coverage target (type-checked by validate_study_config).
  temperature_standardization:
    # Code default (`build_default_study_config`, Task 1); not in the study inputs specification.
    # Not read by any stage.
    baseline: "1960-1990"
    # ---- Study-input parameters with no counterpart in the code default (documentary unless tagged
    # 'Read by') ----
    # From the study inputs specification. Source: Equation (1). Documentary: not consumed by
    # run_research_pipeline.
    transform_name: "seasonal_z_score"
    # From the study inputs specification. Source: §2.1. Documentary: not consumed by
    # run_research_pipeline.
    grouping_variable: "calendar_month"
    # From the study inputs specification. Source: §2.1. Documentary: not consumed by
    # run_research_pipeline.
    mean_estimator: "sample_mean"
    # From the study inputs specification. Source: §2.1. Documentary: not consumed by
    # run_research_pipeline.
    std_estimator: "sample_std_dev"
    # Delta degrees of freedom of sigma_{k,m} (integer). From the study inputs specification.
    # UNSPECIFIED IN MANUSCRIPT — recommended ddof=1. Documentary: not consumed by
    # run_research_pipeline.
    std_ddof_convention: 1
    # Observations per (continent, calendar month) cell in the baseline, unit: count. From the study
    # inputs specification. UNSPECIFIED IN MANUSCRIPT — 31 years × 12 months if endpoints inclusive.
    # Documentary: not consumed by run_research_pipeline.
    baseline_observation_count_per_cell: 31
    # From the study inputs specification. UNSPECIFIED IN MANUSCRIPT — recommended inclusive.
    # Documentary: not consumed by run_research_pipeline.
    baseline_endpoint_inclusion: "inclusive"
    # From the study inputs specification. Derived. Documentary: not consumed by
    # run_research_pipeline.
    source_rows_used: "in_baseline_window == True"
  # Eq. (2) thresholding node. From the study inputs specification. Coverage target (type-checked by
  # validate_study_config).
  temperature_thresholding:
    # tau in Eq. (2), unit: std deviations. From the study inputs specification (named
    # data_preprocessing_parameters.temperature_thresholding.threshold_value there). Source:
    # Equation (2). Not read by any stage.
    tau: 2
    # ---- Study-input parameters with no counterpart in the code default (documentary unless tagged
    # 'Read by') ----
    # From the study inputs specification. Source: Equation (2). Documentary: not consumed by
    # run_research_pipeline.
    threshold_operator: "strict_greater_than"
    # From the study inputs specification. Source: Equation (2). Documentary: not consumed by
    # run_research_pipeline.
    indicator_values: [0, 1]
  # Eq. (3): logit p_{k,t} = beta_0 + beta_1 t + beta_2 t^2, fitted per continent. From the study
  # inputs specification. Coverage target (type-checked by validate_study_config).
  logistic_regression:
    # From the study inputs specification (named
    # data_preprocessing_parameters.logistic_regression.link_function there). Source: Equation (3).
    # Not read by any stage.
    link: "logit"
    # Code default (`build_default_study_config`, Task 1); not in the study inputs specification.
    # Not read by any stage.
    time_trend: "quadratic"
    # Code default (`build_default_study_config`, Task 1); not in the study inputs specification.
    # Not read by any stage.
    time_index_origin: "1940-01-01"
    # Code default (`build_default_study_config`, Task 1); not in the study inputs specification.
    # Not read by any stage.
    time_index_units: "months"
    # Code default (`build_default_study_config`, Task 1); not in the study inputs specification.
    # Not read by any stage.
    restricted_fit_end: "2019-12-31"
    # ---- Study-input parameters with no counterpart in the code default (documentary unless tagged
    # 'Read by') ----
    # From the study inputs specification. Source: §2.1. Documentary: not consumed by
    # run_research_pipeline.
    model_class: "logistic_regression"
    # From the study inputs specification. Source: §2.1. Documentary: not consumed by
    # run_research_pipeline.
    trend_order: 2
    # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
    polynomial_basis_terms: ["intercept", "t", "t^2"]
    # From the study inputs specification. UNSPECIFIED IN MANUSCRIPT — time index t was not defined.
    # Recommended: integer count of months since 1940-01 (t=1 at 1940-01). Alternative: fractional
    # year (1940.0 at 1940-01). Documentary: not consumed by run_research_pipeline.
    time_index_definition: "months_since_1940_01"
    # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
    estimation_method: "maximum_likelihood"
    # From the study inputs specification. UNSPECIFIED IN MANUSCRIPT — IRLS is standard.
    # Documentary: not consumed by run_research_pipeline.
    numerical_solver: "irls"
    # IRLS convergence tolerance (dimensionless). From the study inputs specification. UNSPECIFIED
    # IN MANUSCRIPT. Documentary: not consumed by run_research_pipeline.
    convergence_tolerance: 1.0e-08
    # From the study inputs specification. UNSPECIFIED IN MANUSCRIPT. Documentary: not consumed by
    # run_research_pipeline.
    max_iterations: 100
    # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
    fit_per_continent: true
    # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
    full_sample_fit_window: ["1940-01-01", "2025-04-30"]
    # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
    restricted_sample_fit_window: ["1940-01-01", "2019-12-31"]
  # Eq. (11)-(12) exposure mapping. From the study inputs specification. Coverage target
  # (type-checked by validate_study_config).
  exposure_mapping:
    # Eq. (11): AI_i = Tangible Assets_i / Revenue_i.
    asset_intensity:
      # Code default (`build_default_study_config`, Task 1); not in the study inputs specification.
      # Not read by any stage.
      numerator: "tangible_assets_usd"
      # Code default (`build_default_study_config`, Task 1); not in the study inputs specification.
      # Not read by any stage.
      denominator: "revenue_usd"
      # Sec. 3.1 sector-average AI benchmarks (dimensionless ratio).
      sector_benchmarks:
        # Code default (`build_default_study_config`, Task 1); not in the study inputs
        # specification. Not read by any stage.
        "Real Estate": 10.6
        # Code default (`build_default_study_config`, Task 1); not in the study inputs
        # specification. Not read by any stage.
        Retailers: 0.6
    # Eq. (12) climate-normalised weight alpha_k(w). SHAPE CLASH resolved: the study inputs
    # specification gives a plain string "α_k(w) = Σ_i w_i · AI_i · S_{i,k} / Σ_k Σ_i w_i · AI_i ·
    # S_{i,k}"; the validator needs a dict, so it is stored in 'formula' below.
    climate_normalized_weight_formula:
      # From the study inputs specification. Code default was "sum_i w_i * AI_i * S_ik / sum_j sum_i
      # w_i * AI_i * S_ij"; study-input value kept. Not read by any stage.
      formula: "α_k(w) = Σ_i w_i · AI_i · S_{i,k} / Σ_k Σ_i w_i · AI_i · S_{i,k}"
      # Code default (`build_default_study_config`, Task 1); not in the study inputs specification.
      # Not read by any stage.
      description: "alpha_k(w), climate normalized weight"
    normalized_weights:
      # Code default (`build_default_study_config`, Task 1); not in the study inputs specification.
      # Not read by any stage.
      normalization: "revenue_share_unit_sum"
      # Code default (`build_default_study_config`, Task 1); not in the study inputs specification.
      # Not read by any stage.
      constraint: "sum_to_one"
    # ---- Study-input parameters with no counterpart in the code default (documentary unless tagged
    # 'Read by') ----
    # From the study inputs specification. Source: Equation (11). Documentary: not consumed by
    # run_research_pipeline.
    asset_intensity_definition: "tangible_assets_over_revenue"
    # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
    asset_intensity_attribution: "Azzone et al. (2026b)"
    # From the study inputs specification. UNSPECIFIED IN MANUSCRIPT. Documentary: not consumed by
    # run_research_pipeline.
    tangible_assets_interpretation: "narrow_excludes_intangibles_and_goodwill"
    # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
    revenue_interpretation: "total_revenue"
    # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
    revenue_geography_granularity: "continent"
    # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
    national_extension_annotation: "recommended"
    # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
    normalization_invariant: "Σ_k α_k(w) = 1"
    # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
    country_mapping_rule_for_segments: "df_segment_to_continent_map_raw"
    # From the study inputs specification. UNSPECIFIED IN MANUSCRIPT. Documentary: not consumed by
    # run_research_pipeline.
    residual_revenue_assignment: "proportional_to_disclosed_segments"
  # Eq. (20) weighted Jaccard distance (code node).
  jaccard_distance:
    # Code default (`build_default_study_config`, Task 1); not in the study inputs specification.
    # Not read by any stage.
    formula: "one_minus_sum_min_over_sum_max"
    # Code default (`build_default_study_config`, Task 1); not in the study inputs specification.
    # Not read by any stage.
    domain: "portfolio_weight_vectors"
  # ---- Study-input parameters with no counterpart in the code default (documentary unless tagged
  # 'Read by') ----
  # From the study inputs specification.
  return_aggregation:
    # From the study inputs specification. Source: §2.4. Documentary: not consumed by
    # run_research_pipeline.
    return_type: "total_return"
    # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
    total_return_components: ["price_changes", "dividends", "stock_splits", "corporate_actions"]
    # From the study inputs specification. Source: §2.4. Documentary: not consumed by
    # run_research_pipeline.
    aggregation_weight: "market_capitalization_weighted"
    # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
    sector_assignment_rule: "single_primary_sector"
    # From the study inputs specification.
    survivorship_bias_control:
      # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
      data_sufficiency: true
      # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
      constituency_2020: true
      # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
      constituency_2025: true
    # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
    exclusion_rationale: "geographic_exposure_indeterminable"
    # From the study inputs specification. Source: §2.4. Documentary: not consumed by
    # run_research_pipeline.
    number_of_sectors_in_analysis: 23
    # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
    fx_conversion_before_aggregation: true
  # From the study inputs specification.
  covariance_preprocessing:
    # From the study inputs specification. Source: §4.2 Remark. Documentary: not consumed by
    # run_research_pipeline.
    estimator: "ledoit_wolf_shrinkage"
    # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
    shrinkage_formula: "Σ = (1 - δ*) S + δ* F"
    # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
    shrinkage_reference: "Ledoit and Wolf (2004)"
    # From the study inputs specification. UNSPECIFIED IN MANUSCRIPT — Target F was not specified.
    # Three options are analytically supported: "scaled_identity", "constant_correlation",
    # "single_index". Recommended: "scaled_identity" (most parsimonious and produces the mildest
    # shrinkage bias for diversified universes). Documentary: not consumed by run_research_pipeline.
    shrinkage_target_F: "scaled_identity"
    # Upper bound on cond(Sigma) (dimensionless). From the study inputs specification. Source: §4.2
    # Remark. Documentary: not consumed by run_research_pipeline.
    condition_number_ceiling: 1000
    # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
    condition_number_reference: "Won et al. (2013)"
    # From the study inputs specification. Source: §5. Documentary: not consumed by
    # run_research_pipeline.
    estimation_frequency: "daily"
    # From the study inputs specification. Source: §5. Documentary: not consumed by
    # run_research_pipeline.
    estimation_window: "rolling_5_year"

