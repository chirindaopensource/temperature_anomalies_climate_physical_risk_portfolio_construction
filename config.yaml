# --------------------------------------------------------------------------------------------------
# 8. Module M5 CRE/CEV metrics: Eq. (13)-(18)
# --------------------------------------------------------------------------------------------------
# Module M5: CRE/CEV metrics, Eq. (13)-(18). From the study inputs specification.
module_M5_metrics:
  # Eq. (13) Climate Risk Exposure. SHAPE CLASH resolved: the study inputs specification gives a
  # plain string "CRE(w,t) = Σ_k α_k(w) · p_{k,t}"; the validator needs a dict, so it is stored in
  # 'formula' below. Coverage target (type-checked by validate_study_config).
  CRE_formula:
    # From the study inputs specification. Source: Equation (13). Code default was "sum_k alpha_k(w)
    # * p_k,t"; study-input value kept. Not read by any stage.
    formula: "CRE(w,t) = Σ_k α_k(w) · p_{k,t}"
  # Eq. (14) CEV, variance form. SHAPE CLASH resolved: the study inputs specification gives a plain
  # string "CEV(w,t) = Σ_k α_k^2 Var(B_{k,t}) + 2 Σ_{k<j} α_k α_j Cov(B_{k,t}, B_{j,t})"; the
  # validator needs a dict, so it is stored in 'formula' below. Coverage target (type-checked by
  # validate_study_config).
  CEV_formula_variance_form:
    # From the study inputs specification. Code default was "Var(sum_k alpha_k(w) * B_k,t)";
    # study-input value kept. Not read by any stage.
    formula: "CEV(w,t) = Σ_k α_k^2 Var(B_{k,t}) + 2 Σ_{k<j} α_k α_j Cov(B_{k,t}, B_{j,t})"
  # Eq. (15) Bernoulli covariance. SHAPE CLASH resolved: the study inputs specification gives a
  # plain string "ρ_{k,j} sqrt(Var(B_k) Var(B_j))"; the validator needs a dict, so it is stored in
  # 'formula' below. Coverage target (type-checked by validate_study_config).
  covariance_formula:
    # From the study inputs specification. Source: Equation (15). Code default was "rho_kj *
    # sqrt(p_k*(1-p_k) * p_j*(1-p_j))"; study-input value kept. Not read by any stage.
    formula: "ρ_{k,j} sqrt(Var(B_k) Var(B_j))"
  # Eq. (16) CEV, expanded form. SHAPE CLASH resolved: the study inputs specification gives a plain
  # string "CEV(w,t) = Σ_k α_k^2 p_{k,t}(1-p_{k,t}) + 2 Σ_{k<j} α_k α_j ρ_{k,j}
  # sqrt(p_{k,t}(1-p_{k,t}) p_{j,t}(1-p_{j,t}))"; the validator needs a dict, so it is stored in
  # 'formula' below. Coverage target (type-checked by validate_study_config).
  CEV_formula_expanded:
    # From the study inputs specification. Code default was "sum_k alpha_k^2 * p_k*(1-p_k) +
    # 2*sum_(k<j) alpha_k*alpha_j*rho_kj*sqrt(p_k*(1-p_k)*p_j*(1-p_j))"; study-input value kept. Not
    # read by any stage.
    formula: "CEV(w,t) = Σ_k α_k^2 p_{k,t}(1-p_{k,t}) + 2 Σ_{k<j} α_k α_j ρ_{k,j} \
      sqrt(p_{k,t}(1-p_{k,t}) p_{j,t}(1-p_{j,t}))"
  # Eq. (17) idiosyncratic (Herfindahl) limit. SHAPE CLASH resolved: the study inputs specification
  # gives a plain string "1/K · p(1-p) → 0 as K → ∞"; the validator needs a dict, so it is stored in
  # 'formula' below. Coverage target (type-checked by validate_study_config).
  idiosyncratic_limit:
    # Code default (`build_default_study_config`, Task 1); not in the study inputs specification.
    # Not read by any stage.
    form: "uniform_probability_diagonal_term"
    # From the study inputs specification. Source: Equation (17). Code default was "(1/K) * p * (1 -
    # p)"; study-input value kept. Not read by any stage.
    formula: "1/K · p(1-p) → 0 as K → ∞"
  # Eq. (18) systemic limit. SHAPE CLASH resolved: the study inputs specification gives a plain
  # string "(1 - 1/K) · ρ p(1-p) → ρ p(1-p) as K → ∞"; the validator needs a dict, so it is stored
  # in 'formula' below. Coverage target (type-checked by validate_study_config).
  systemic_limit:
    # Code default (`build_default_study_config`, Task 1); not in the study inputs specification.
    # Not read by any stage.
    form: "uniform_correlation_limit"
    # From the study inputs specification. Source: Equation (18). Code default was "(1 - 1/K) * rho
    # * p * (1 - p)"; study-input value kept. Not read by any stage.
    formula: "(1 - 1/K) · ρ p(1-p) → ρ p(1-p) as K → ∞"
    # Code default (`build_default_study_config`, Task 1); not in the study inputs specification.
    # Not read by any stage.
    limit_as_K_to_infinity: "rho * p * (1 - p)"
  # ---- Study-input parameters with no counterpart in the code default (documentary unless tagged
  # 'Read by') ----
  # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
  CRE_interpretation: "baseline_physical_risk"
  # From the study inputs specification. Source: Equation (14). Documentary: not consumed by
  # run_research_pipeline.
  bernoulli_variance_formula: "p_{k,t}(1 - p_{k,t})"
  # From the study inputs specification.
  decomposition_terms:
    # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
    idiosyncratic: "Σ_k α_k^2 p_{k,t}(1-p_{k,t})"
    # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
    systemic: "2 Σ_{k<j} α_k α_j Cov(B_{k,t}, B_{j,t})"
  # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
  herfindahl_minimum_condition: "α_k = 1/K for all k"
  # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
  systemic_floor: "ρ p(1-p)"
  # From the study inputs specification. Source: §4.2 Remark. Documentary: not consumed by
  # run_research_pipeline.
  vectorization_required: true
  # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
  figure_5_strategies:
    - "MSCI World Portfolio"
    - "Equally Weighted Continent Portfolio"
    - "Inverse Risk Weighted Portfolio"
  # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
  figure_6_correlation_scenarios:
    - "Pearson Correlation"
    - "Maximum Bound Correlation"
    - "Minimum Bound Correlation"
  # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
  appendix_B_alternative_objective: "CRE"
  # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
  figure_5_crossover_year_approx: 2010
  # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
  figure_5_crossover_rationale: "p_k_above_0_5_reduces_bernoulli_variance"

# --------------------------------------------------------------------------------------------------
# 9. Module M6 optimisation: Eq. (19a)-(19c), (20), Table 4
# --------------------------------------------------------------------------------------------------
# Module M6: 3-objective optimisation, Eq. (19a)-(19c), (20). From the study inputs specification.
module_M6_optimization:
  # Eq. (19a) objectives f1, f2, f3 (all minimised). SHAPE CLASH resolved: the study inputs
  # specification gives a dict f1/f2/f3_primary/f3_appendix_B; validator needs a list, so each entry
  # is a list record with 'id' = the study-input key. Code default was ["return", "variance",
  # "cev"]. Not read by any stage. Coverage target (type-checked by validate_study_config).
  objective_functions:
    - id: "f1"
      name: "expected_return_negated"
      formula: "f1(w) = - w^T r"
      direction: "minimize"
    - id: "f2"
      name: "market_variance"
      formula: "f2(w) = w^T Σ w"
      direction: "minimize"
    - id: "f3_primary"
      name: "Climate_Exposure_Volatility"
      formula: "f3(w) = CEV(w)"
      direction: "minimize"
    - id: "f3_appendix_B"
      name: "Climate_Risk_Exposure"
      formula: "f3(w) = CRE(w)"
      direction: "minimize"
  # From the study inputs specification.
  constraints:
    # Eq. (19b) budget constraint. From the study inputs specification. Source: Equation (19b).
    # DISCREPANCY: code default was "sum_to_1"; study-input value kept. Not read by any stage.
    # Coverage target (type-checked by validate_study_config).
    budget_constraint: "Σ_{i=1}^{120} w_i = 1"
    # Eq. (19c) long-only constraint. From the study inputs specification. Source: Equation (19c).
    # DISCREPANCY: code default was "weights_nonnegative"; study-input value kept. Not read by any
    # stage. Coverage target (type-checked by validate_study_config).
    long_only_constraint: "w_i >= 0 for all i"
    # ---- Study-input parameters with no counterpart in the code default (documentary unless tagged
    # 'Read by') ----
    # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
    no_risk_free_asset: true
    # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
    no_short_selling: true
  # Table 4 universe of N = 120 firms. From the study inputs specification. Coverage target
  # (type-checked by validate_study_config).
  universe_construction:
    # From the study inputs specification (named
    # module_M6_optimization.universe_construction.total_assets there). Not read by any stage.
    size: 120
    # Table 4 quotas (code form): weight_pct is a FRACTION here (0.45 = 45 %). Code default
    # (`build_default_study_config`, Task 1); not in the study inputs specification. Not read by any
    # stage.
    quotas:
      - region: "North America"
        weight_pct: 0.45
        count: 54
      - region: "Europe"
        weight_pct: 0.25
        count: 30
      - region: "Asia"
        weight_pct: 0.25
        count: 30
      - region: "Oceania"
        weight_pct: 0.05
        count: 6
    # Universe anchor date (ISO string), read by Task 14. From the study inputs specification.
    # UNSPECIFIED IN MANUSCRIPT. Read by `orchestrate_task_14` (Task 14).
    anchor_date: "2020-01-01"
    # Code default (`build_default_study_config`, Task 1); not in the study inputs specification.
    # Not read by any stage.
    cap_snapshot: "last_observation_before_anchor"
    # Code default (`build_default_study_config`, Task 1); not in the study inputs specification.
    # Not read by any stage.
    return_gap_rule: "exclude_firm_on_two_or_more_consecutive_missing_months"
    # Code default (`build_default_study_config`, Task 1); not in the study inputs specification.
    # Not read by any stage.
    membership_rule: "msci_world_constituent_at_start_2020_and_2025"
    # ---- Study-input parameters with no counterpart in the code default (documentary unless tagged
    # 'Read by') ----
    # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
    sampling_method: "stratified"
    # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
    stratification_variables: ["market_capitalization", "headquarters_location"]
    # Table 4 quotas (study-input form): weight_pct unit: percent. From the study inputs
    # specification.
    regional_quotas:
      # From the study inputs specification.
      "North America":
        # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
        weight_pct: 45.0
        # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
        asset_count: 54
      # From the study inputs specification.
      Europe:
        # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
        weight_pct: 25.0
        # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
        asset_count: 30
      # From the study inputs specification.
      Asia:
        # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
