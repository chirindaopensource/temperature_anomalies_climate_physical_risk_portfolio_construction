  # Ledoit-Wolf covariance Sigma = (1-d*) S + d* F. From the study inputs specification. Coverage
  # target (type-checked by validate_study_config).
  covariance_estimation:
    # From the study inputs specification (named
    # module_M6_optimization.covariance_estimation.estimator there). DISCREPANCY: code default was
    # "ledoit_wolf"; study-input value kept. Not read by any stage.
    method: "ledoit_wolf_shrinkage"
    # From the study inputs specification (named
    # module_M6_optimization.covariance_estimation.shrinkage_target_F there). UNSPECIFIED IN
    # MANUSCRIPT. Not read by any stage.
    target: "scaled_identity"
    # From the study inputs specification. Not read by any stage.
    condition_number_ceiling: 1000
    # Code's shrinkage search step. Code default (`build_default_study_config`, Task 1); not in the
    # study inputs specification. Not read by any stage.
    shrinkage_step: 0.001
    # ---- Study-input parameters with no counterpart in the code default (documentary unless tagged
