      field: "N/A (run_mopso_optimization)"
      manuscript_wording: "vectorise at generation level with a documented block draw order"
      decision: "Algorithm 1 (Appendix C.2) draws randomness per particle, sequentially, with a \
        draw count that depends on that particle's own outcome (a mutation trigger gates a \
        further Gaussian draw; a dominance tie gates a coin flip). A generation-level \
        vectorisation cannot batch the arithmetic while also preserving that outcome-dependent \
        consumption order, so fixed-size named blocks (leader, r1, r2, mutation trigger/noise via \
        apply_mutation, acceptance coin, personal-best coin) are drawn once per generation in one \
        fixed order instead, drawing the two coin blocks unconditionally for every particle \
        rather than only for triggered or tied rows; this changes WHICH stream values each \
        particle consumes relative to the strictly per-particle order, never the dominance rule, \
        Table C.10 parameters, or the Task 1 generator"
      rationale: "Algorithm 1 (Appendix C.2) draws randomness per particle, sequentially, with a \
        draw count that depends on that particle's own outcome (a mutation trigger gates a \
