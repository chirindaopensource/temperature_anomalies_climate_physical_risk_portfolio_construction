      field: "global_design_constants.windows.baseline"
      manuscript_wording: "Section 2.1 calls 1960-1990 a '30-year window'"
      decision: "inclusive endpoints, 31 obs/month"
      rationale: "Task 2 Step 1 requires exactly 31 observations per (continent, calendar_month) \
        over the stated 1960-1990 endpoints"
      location: "validate_temperature_coverage (Task 2)"
    - id: "JC-driscoll-kraay"
      field: "module_M3_regressions.specification_3_global_panel.s tandard_errors"
      manuscript_wording: "HAC (Newey-West) robust standard errors is specified for Equation (8) \
        only; the manuscript is silent on the panel (Eq 9-10) standard-error estimator"
      decision: "Driscoll-Kraay adopted as the PRIMARY panel estimator; stacked-row Newey-West \
        retained as a labelled sensitivity diagnostic only"
      rationale: "within a month every continent's row shares the same sector return and the same \
        market shock, so residuals are strongly cross-sectionally dependent; a Newey-West \
        estimator over stacked rows is invalid for gamma_s/Gamma inference, while Driscoll-Kraay \
        IS a HAC estimator (grouped-sum HAC across months) that respects the panel structure"
      location: "estimate_panel_fe (Task 19)"
