# --------------------------------------------------------------------------------------------------
# 6. Module M2 dependence: Eq. (4)-(7)
# --------------------------------------------------------------------------------------------------
# Module M2: dependence of extreme events, Eq. (4)-(7). From the study inputs specification.
module_M2_dependence:
  # From the study inputs specification. Coverage target (type-checked by validate_study_config).
  frechet_hoeffding:
    # Eq. (5) rho_min. From the study inputs specification. DISCREPANCY: code default was "(max(0,
    # p1+p2-1) - p1*p2) / sqrt(p1*(1-p1)*p2*(1-p2))"; study-input value kept. Not read by any stage.
    # Coverage target (type-checked by validate_study_config).
    lower_bound_formula: "rho_min = (max(0, p1+p2-1) - p1*p2) / (sqrt(p1(1-p1))*sqrt(p2(1-p2)))"
    # Eq. (6) rho_max. From the study inputs specification. DISCREPANCY: code default was "(min(p1,
    # p2) - p1*p2) / sqrt(p1*(1-p1)*p2*(1-p2))"; study-input value kept. Not read by any stage.
    # Coverage target (type-checked by validate_study_config).
    upper_bound_formula: "rho_max = (min(p1, p2) - p1*p2) / (sqrt(p1(1-p1))*sqrt(p2(1-p2)))"
    # Eq. (7) p-bar averaging window as 'YYYY-YYYY' (read by Task 12). From the study inputs
    # specification. DISCREPANCY: study inputs give ["1940-01-01", "2020-12-31"];
    # `orchestrate_task_12` (Task 12) parses this value with str(...).split('-') as 'YYYY-YYYY' and
    # raises FATAL otherwise; the study-input list form cannot parse, so the code value is kept.
    # Read by `orchestrate_task_12` (Task 12) (parsed as 'YYYY-YYYY'). Coverage target (type-checked
    # by validate_study_config).
    marginal_averaging_window: "1940-2020"
    # ---- Study-input parameters with no counterpart in the code default (documentary unless tagged
    # 'Read by') ----
    # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
    auxiliary_variable_distribution: "uniform_0_1"
    # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
    marginal_representation: "time_averaged_probability"
    # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
    perfect_correlation_condition: "p1 = p2"
    # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
    perfect_anticorrelation_condition: "p1 = 1 - p2"
    # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
    higher_order_constraints_available: false
    # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
    closed_form_threshold_variable_count: 4
    # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
    reference_for_constraints: "Huber and Marić (2015, 2019)"
    # From the study inputs specification. UNSPECIFIED IN MANUSCRIPT — the paper holds ρ constant
    # across the backtest while p_{k,t} varies. Recorded explicitly. Documentary: not consumed by
    # run_research_pipeline.
    final_correlation_used_in_CEV: "empirical_pearson_held_constant"
  # ---- Study-input parameters with no counterpart in the code default (documentary unless tagged
  # 'Read by') ----
  # From the study inputs specification. Source: §2.2. Documentary: not consumed by
  # run_research_pipeline.
  correlation_measure: "pearson"
  # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
  pairing_scope: "all_unordered_pairs"
  # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
  total_pair_count: 15
  # Reported Pearson range (Sec. 2.2), unit: correlation. From the study inputs specification.
  # Source: §2.2. Documentary: not consumed by run_research_pipeline.
  expected_value_range: [0.0, 0.48]
  # From the study inputs specification. Source: §2.2. Documentary: not consumed by
  # run_research_pipeline.
  expected_sign: "positive"

# --------------------------------------------------------------------------------------------------
# 7. Module M3 return regressions: Eq. (8)-(10)
# --------------------------------------------------------------------------------------------------
# Module M3: return regressions, Eq. (8)-(10). From the study inputs specification.
module_M3_regressions:
  # Eq. (8): R_{s,k,t} - R_{f,t} = a + b (R_{MKT,t} - R_{f,t}) + gamma_{s,k} B_{k,t} + e. From the
  # study inputs specification. Coverage target (type-checked by validate_study_config).
  specification_1_extended_capm:
    # Code default (`build_default_study_config`, Task 1); not in the study inputs specification.
    # Not read by any stage.
    factors: ["mkt", "climate"]
    # ---- Study-input parameters with no counterpart in the code default (documentary unless tagged
    # 'Read by') ----
    # From the study inputs specification. Source: Equation (8). Documentary: not consumed by
    # run_research_pipeline.
    dependent_variable: "R_{s,k,t} - R_{f,t}"
    # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
    covariates: ["intercept", "R_{MKT,t} - R_{f,t}", "B_{k,t}"]
    # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
    parameter_of_interest: "gamma_{s,k}"
    # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
    estimator: "OLS"
    # From the study inputs specification. Source: §2.4. Documentary: not consumed by
    # run_research_pipeline.
    standard_error_type: "HAC_newey_west"
    # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
    HAC_reference: "Newey and West (1986)"
    # From the study inputs specification. UNSPECIFIED IN MANUSCRIPT — recommended rule per
    # Newey-West standard. Documentary: not consumed by run_research_pipeline.
    HAC_lag_rule: "floor(4*(T/100)^(2/9))"
    # From the study inputs specification. UNSPECIFIED IN MANUSCRIPT — standard default.
    # Documentary: not consumed by run_research_pipeline.
    HAC_kernel: "bartlett"
    # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
    significance_levels: [0.1, 0.05, 0.01]
    # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
    reporting_p_value_threshold: 0.1
  # Eq. (9) sector panel with month/continent FE. From the study inputs specification. Coverage
  # target (type-checked by validate_study_config).
  specification_2_sector_panel:
    # Code default (`build_default_study_config`, Task 1); not in the study inputs specification.
    # Not read by any stage.
    effects: ["month", "continent"]
    # ---- Study-input parameters with no counterpart in the code default (documentary unless tagged
    # 'Read by') ----
    # From the study inputs specification. Source: Equation (9). Documentary: not consumed by
    # run_research_pipeline.
    dependent_variable: "R_{s,k,t} - R_{f,t}"
    # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
    parameter_of_interest: "gamma_s"
    # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
    pooling_scope: "within_sector_across_continents"
    # From the study inputs specification.
    fixed_effects:
      # From the study inputs specification.
      month:
        # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
        type: "dummy_variables"
        # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
        count: 12
      # From the study inputs specification.
      continent:
        # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
        type: "dummy_variables"
        # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
        count: 6
    # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
    estimator: "panel_OLS_with_within_transformation"
    # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
    standard_error_type: "HAC_newey_west"
    # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
    significance_levels: [0.1, 0.05, 0.01]
    # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
    reporting_p_value_threshold: 0.1
  # Eq. (10) global pooled panel. From the study inputs specification. Coverage target (type-checked
  # by validate_study_config).
  specification_3_global_panel:
    # Code default (`build_default_study_config`, Task 1); not in the study inputs specification.
    # Not read by any stage.
    effects: ["month", "continent"]
    # Code default (`build_default_study_config`, Task 1); not in the study inputs specification.
    # Not read by any stage.
    standard_errors: "Driscoll_Kraay"
    # Code default (`build_default_study_config`, Task 1); not in the study inputs specification.
    # Not read by any stage.
    standard_errors_sensitivity: "stacked_row_Newey_West"
    # ---- Study-input parameters with no counterpart in the code default (documentary unless tagged
    # 'Read by') ----
    # From the study inputs specification. Source: Equation (10). Documentary: not consumed by
    # run_research_pipeline.
    dependent_variable: "R_{s,k,t} - R_{f,t}"
    # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
    parameter_of_interest: "Gamma_global"
    # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
    pooling_scope: "all_sectors_and_all_continents"
    # From the study inputs specification.
    fixed_effects:
      # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
      month: 12
      # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
      continent: 6
    # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
    standard_error_type: "HAC_newey_west"
    # Reported Gamma (Sec. 2.4), unit: monthly return per extreme event. From the study inputs
    # specification. Source: §2.4. Documentary: not consumed by run_research_pipeline.
    expected_value: -0.003
    # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
    expected_p_value: 0.0096
  # Code's HAC estimator settings for the panel regressions.
  HAC_settings:
