    # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
    window_length_years: 5
    # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
    lookback_type: "rolling"
  # From the study inputs specification.
  active_weight_analysis:
    # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
    average_active_three_objective: 22
    # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
    low_variance_active_count: 55
    # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
    mean_variance_only_active_count: 14
  # Eq. (20) weighted Jaccard distance (study-input node). From the study inputs specification.
  # Coverage target (type-checked by validate_study_config).
  jaccard_distance:
    # From the study inputs specification. Documentary: not consumed by run_research_pipeline.
